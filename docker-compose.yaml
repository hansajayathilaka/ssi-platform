  cred-issuance:
    container_name: cred-issuance
    build:
      context: ./services/credential-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - OOBI_ENDPOINT=http://cred-issuance:3001
      - KERIA_ENDPOINT=https://keria.hansajayathilaka.com
      - KERIA_BOOT_ENDPOINT=https://keria-boot.hansajayathilaka.com
      # Branding Configuration
      - CUSTOM_ORG_NAME=${CUSTOM_ORG_NAME:-Default Organization}
      - CUSTOM_LOGO_PATH=${CUSTOM_LOGO_PATH:-/app/assets/logo.png}
      - CUSTOM_PRIMARY_COLOR=${CUSTOM_PRIMARY_COLOR:-#1976d2}
      - CUSTOM_SECONDARY_COLOR=${CUSTOM_SECONDARY_COLOR:-#dc004e}
      # Schema Configuration
      - CUSTOM_SCHEMAS_PATH=${CUSTOM_SCHEMAS_PATH:-/app/data/schemas}
      - BUILT_IN_SCHEMAS_PATH=/app/schemas
      - ENABLE_SCHEMA_MANAGEMENT=${ENABLE_SCHEMA_MANAGEMENT:-true}
      - SCHEMA_VALIDATION_STRICT=${SCHEMA_VALIDATION_STRICT:-true}
      # Feature Flags
      - ENABLE_BRANDING_CUSTOMIZATION=${ENABLE_BRANDING_CUSTOMIZATION:-true}
      - ENABLE_BULK_CREDENTIAL_GENERATION=${ENABLE_BULK_CREDENTIAL_GENERATION:-true}
    ports:
      - 3001:3001
    volumes:
      - issuer-server-data:/app/data
      - custom-schemas:/app/data/schemas
      - branding-assets:/app/assets
      - ./custom-config:/app/config:ro

  cred-issuance-ui:
    container_name: cred-issuance-ui
    build:
      context: ./services/credential-server-ui
      dockerfile: ./Dockerfile
      args:
        - VITE_SERVER_URL=${CRED_UI_SERVER_URL:-http://localhost:3001}
        - VITE_CUSTOM_ORG_NAME=${CUSTOM_ORG_NAME:-Default Organization}
        - VITE_CUSTOM_LOGO_PATH=${CUSTOM_LOGO_PATH:-/assets/logo.png}
        - VITE_CUSTOM_PRIMARY_COLOR=${CUSTOM_PRIMARY_COLOR:-#1976d2}
        - VITE_CUSTOM_SECONDARY_COLOR=${CUSTOM_SECONDARY_COLOR:-#dc004e}
        - VITE_ENABLE_BRANDING_CUSTOMIZATION=${ENABLE_BRANDING_CUSTOMIZATION:-true}
        - VITE_ENABLE_BULK_CREDENTIAL_GENERATION=${ENABLE_BULK_CREDENTIAL_GENERATION:-true}
    restart: unless-stopped
    ports:
      - 3000:80
    volumes:
      - branding-assets:/usr/share/nginx/html/assets:ro

volumes:
  keria-data:
  issuer-server-data:
  custom-schemas:
  branding-assets:
